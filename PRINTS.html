<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Horas Voluntarias</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#be123c}
.btn.main{background:#be123c}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Horas Voluntarias</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Horta comunitaria</strong><div class="muted">2h</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Apoio biblioteca</strong><div class="muted">1h</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Mutirao limpeza</strong><div class="muted">3h</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Oficina kids</strong><div class="muted">2h</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Recepcao evento</strong><div class="muted">1h</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Horas Voluntarias</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="total">
        <div class="linha">
        <span>Horas acumuladas</span>
        <span>3h</span>
        </div>
        <div class="linha g">
        <span>Minimo certificado</span>
        <span>4h</span>
        </div>
        </div>
        <div class="aviso erro">Faltam 1h para liberar certificado</div>
        <button class="btn ghost">Gerar certificado</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
